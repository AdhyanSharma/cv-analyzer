name: CI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cv_analyzer
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d cv_analyzer"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/cv_analyzer
      PYTHONPATH: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        shell: bash
        run: |
          set -e
          if [[ -f "requirements-api-v12.txt" ]]; then
            pip install -r requirements-api-v12.txt
          elif [[ -f "requirements-api-v11.txt" ]]; then
            pip install -r requirements-api-v11.txt
          else
            echo "No API requirements file found; using requirements.txt"
            pip install -r requirements.txt
          fi
          pip install pytest httpx

      - name: Run backend tests
        run: |
          pytest backend/tests -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build

  docker:
    name: Docker validation
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create CI environment file
        shell: bash
        run: |
          printf '%s\n' 'JWT_SECRET=ci-only-validation-secret' > .env.ci

      - name: Validate Compose file
        run: docker compose --env-file .env.ci config --quiet

      - name: Build API image
        run: docker compose --env-file .env.ci build api

      - name: Build frontend image
        run: docker compose --env-file .env.ci build frontend
