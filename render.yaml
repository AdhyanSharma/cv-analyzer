services:
  # ------------------------------------------------------------
  # FastAPI backend
  # ------------------------------------------------------------
  - type: web
    name: cv-analyzer-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /health

    envVars:
      - key: PORT
        value: "8000"

      - key: DATABASE_URL
        fromDatabase:
          name: cv-analyzer-db
          property: connectionString

      - key: JWT_SECRET
        generateValue: true

      - key: GEMINI_API_KEY
        sync: false

      - key: GEMINI_SCREENING_MODEL
        value: "gemini-3.5-flash-lite"

  # ------------------------------------------------------------
  # React + Nginx frontend
  # ------------------------------------------------------------
  - type: web
    name: cv-analyzer-frontend
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /

    envVars:
      - key: PORT
        value: "80"

      # Enter the public API URL after the API service is created.
      # Example:
      # https://cv-analyzer-api.onrender.com
      - key: VITE_API_BASE_URL
        sync: false

databases:
  - name: cv-analyzer-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"
