services:
  - type: web
    name: cv-analyzer-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /health

    envVars:
      - key: PORT
        value: "8000"

      - key: DATABASE_URL
        fromDatabase:
          name: cv-analyzer-db
          property: connectionString

      - key: JWT_SECRET
        generateValue: true

      - key: GEMINI_API_KEY
        sync: false

      - key: GEMINI_SCREENING_MODEL
        value: "gemini-3.5-flash-lite"

  - type: web
    name: cv-analyzer-frontend
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /healthz

    envVars:
      - key: BACKEND_HOSTPORT
        fromService:
          name: cv-analyzer-api
          type: web
          property: hostport

databases:
  - name: cv-analyzer-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"
